# SBOZOR — repo ildizi: FAQAT vosita konfiguratsiyasi.
#
# `[project]` bo'limi ATAYIN YO'Q — uv bu katalogni loyiha deb hisoblamasligi
# kerak. Har bir servis o'z `pyproject.toml` + `uv.lock` iga ega (aiogram
# pydantic/redis pin konflikti shuni talab qiladi).

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Sessiya doirasidagi async fixture'lar (`app_engine`) va ularni ishlatadigan
# testlar AYNAN BIR event loop'da bo'lishi shart — aks holda asyncpg ulanishi
# boshqa loop'ga bog'lanib qoladi va test "loop is closed" bilan yiqiladi.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# `.`     -> `migrations` paketi (helpers, entities) testlardan import qilinadi;
#            Alembic ham `prepend_sys_path = .` bilan aynan shu yo'lni ishlatadi.
# `tests` -> `fixtures` paketi (seed'lar va umumiy fixture tiplari).
# Bu ATAYIN aniq yozilgan: pytest'ning rootdir'ga qarab sys.path ni o'zi
# to'ldirishi test faylining qayerda turishiga bog'liq va jimgina o'zgaradi.
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
markers = [
    "tenancy: tenant izolyatsiyasi (RLS) invariantlari — faza darvozasi, majburiy yashil",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "node_modules", ".planning", "frontend", ".next"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Testlarda `assert` — pytest'ning asosiy mexanizmi.
# S105/S106: test fixture'laridagi dev parol literallari (haqiqiy sir emas).
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["^frontend/", "^\\.planning/"]
# `tests/fixtures` paketi test modullaridan `fixtures.*` sifatida import
# qilinadi (pytest `pythonpath` bilan bir xil yo'l).
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "alembic_utils.*"]
ignore_missing_imports = true
