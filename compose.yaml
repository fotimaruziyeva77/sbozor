# SBOZOR — yagona orkestratsiya nuqtasi.
# Xost mashinasida `make` YO'Q (Windows) — barcha yorliqlar root `package.json` da.
#
# Profillar:
#   (yo'q)   -> db, cache, storage, core-api, worker, scheduler, go2rtc : `npm run up`
#   migrate  -> Alembic one-shot job   : `npm run migrate`
#   web      -> frontend (01-02 rejasi Dockerfile'ni yaratadi)
#   proxy    -> nginx
#   test     -> pytest + testcontainers: `npm run test`
#   sim      -> nvr-sim + nvr-sim-rtsp (CAM-09): `npm run test:sim`

name: sbozor

services:
  db:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbozor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SBOZOR_OWNER_PASSWORD: ${SBOZOR_OWNER_PASSWORD}
      SBOZOR_APP_PASSWORD: ${SBOZOR_APP_PASSWORD}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      # DIQQAT: postgres 18+ image'i ma'lumotni major-versiya bo'yicha
      # kataloglarda saqlaydi (/var/lib/postgresql/18/docker), shuning uchun
      # volume `/var/lib/postgresql` ga o'rnatiladi — `/var/lib/postgresql/data` ga EMAS
      # (aks holda konteyner "unused mount/volume" xatosi bilan yiqiladi).
      - pgdata:/var/lib/postgresql
      # Rollar + parollar: faqat birinchi ishga tushishda (bo'sh data katalogida) bajariladi.
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DIQQAT: xost portiga publish QILINMAYDI (T-01-04).
    # Dev uchun `compose.override.yml` uni 127.0.0.1 ga bog'laydi.
    restart: unless-stopped

  cache:
    image: valkey/valkey:9.1.1-alpine
    # Kesh — davomiylik kerak emas (volume yo'q), RDB/AOF o'chirilgan.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    # DALIL-KADRLARNING S3-MOS ARXIVI (04-01, CAM-07, W0-4).
    #
    # ⚠ PROFILSIZ — `worker` va `go2rtc` bilan bir xil sabab: bu ISHLAB
    # CHIQARISH komponenti. Profil ortiga yashirilsa kadr olish zanjiri
    # yuklash bosqichida yiqilardi va sabab «tarmoq nosozligi» bo'lib
    # ko'rinardi.
    #
    # OLTINCHI KONTEYNER, UCHINCHI SERVIS EMAS: SeaweedFS — TAYYOR image,
    # biz yozgan kod emas (`db`, `cache`, `go2rtc`, `nginx` bilan bir
    # toifa). CLAUDE.md ning «aynan 3 ta servis» cheklovi BIZNING
    # servislarimizga tegishli va u buzilmaydi.
    #
    # MinIO EMAS: repo 2026-04-25 da ARXIVLANGAN (read-only, xavfsizlik
    # yamog'i yo'q) va bu yerda shaxsiy ma'lumot saqlanadi. Garage ham
    # emas — AGPL-3.0 (CLAUDE.md taqig'i). SeaweedFS 4.40 — Apache-2.0.
    image: chrislusf/seaweedfs:4.40
    command:
      - "server"
      - "-dir=/data"
      - "-s3"
      # ⚠ 8333 — SeaweedFS ning STANDART qiymati, lekin u ANIQ beriladi:
      # standartga tayanish keyingi major versiyada jimgina buzilardi va
      # healthcheck bilan ilova ikkalasi birdan boshqa portga qarardi.
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/s3.json"
      # Ko'p mayda fayl (175 JPEG/kun/bozor) — SeaweedFS ning maqsadli
      # holati. 1 GB volume fayllari zaxira nusxa uchun qulay.
      - "-master.volumeSizeLimitMB=1024"
    volumes:
      - seaweed:/data
      # ⚠ `:ro` MAJBURIY — `go2rtc.yaml` va `mediamtx.yml` bilan bir xil
      # qoida: server o'z konfiguratsiyasini QAYTA YOZA OLMASLIGI kerak.
      #
      # ⚠ BU FAYL REPODA YO'Q va bo'lmasligi ham kerak — unda S3 sirlari
      # bor. Repoda `ops/seaweedfs/s3.json.example` turadi (`.env.example`
      # va `wg0.conf.example` bilan aynan bir xil naqsh):
      #     cp ops/seaweedfs/s3.json.example ops/seaweedfs/s3.json
      # va ichidagi namunaviy kalitlarni haqiqiylari bilan almashtiring
      # (yo'riqnoma — `ops/seaweedfs/README.md`).
      - ./ops/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    # =====================================================================
    # ⚠⚠ `ports:` BLOKI ATAYIN YO'Q — VA U QO'SHILMAYDI (T-04-02).
    #
    # `go2rtc` dagi ogohlantirish (pastda, 8555/udp bandi) SO'ZMA-SO'Z shu
    # yerga tegishli: compose `ports:` bandi Docker'ning `iptables`
    # qoidalarini yozadi va u host firewall'ini CHETLAB O'TADI — ya'ni
    # «UFW da yopiq» degan ishonch YOLG'ON bo'lib qolardi.
    #
    # Bu ombor BARCHA bozorlarning dalil-kadrlarini saqlaydi; ular bozor
    # tashrifchilarining shaxsiy ma'lumoti va O'zR qonuni ostidagi
    # ma'lumot. Rasmga yagona yo'l — `core-api` ning proxy endpointi
    # (04-09), presigned URL EMAS.
    # =====================================================================
    healthcheck:
      # `nc` — `go2rtc` va `nvr-sim-rtsp` bilan BIR XIL qaror: «jarayon
      # tinglayaptimi?» savoliga to'liq javob va u tekshirilmagan
      # endpointga tayanmaydi.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    # One-shot job. Alembic ILOVA STARTUP'ida ishga tushmaydi.
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      # DDL egasi roli — ilova roli EMAS.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      TZ: ${TZ:-Asia/Tashkent}
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    # --workers 1: kelajakdagi scheduler/cron dublikatining oldini oladi.
    #
    # --proxy-headers + --forwarded-allow-ips (CR-04) — bu ikkisi MAJBURIY.
    # uvicorn `X-Forwarded-For` ni FAQAT `--forwarded-allow-ips` ro'yxatidagi
    # manzildan qabul qiladi; standart qiymat `127.0.0.1`. nginx esa compose
    # tarmog'ida BOSHQA konteyner manzilida turadi — ya'ni bayroqsiz uning
    # sarlavhasi TASHLAB YUBORILADI va `request.client.host` har doim proxy
    # IP'si bo'lardi (`auth.py::_client_ip` ishonch qarorini ataylab shu
    # qatlamga topshiradi). Oqibati ikkita:
    #   1) `rl:login:ip:<proxy-ip>` — BUTUN PLATFORMA uchun bitta sanagich.
    #      Chegara (IP_LIMIT=50) parol tekshiruvidan OLDIN ishlaydi, ya'ni
    #      muvaffaqiyatli login uni tozalay olmaydi: ~51 anonim so'rov barcha
    #      kassir/admin/direktorni 15 daqiqaga qulflaydi.
    #   2) `audit_log.ip` har doim proxy manzilini yozadi — "kimdan" savoli
    #      javobsiz qoladi (FOUND-03 dalil sifati).
    #
    # `*` NEGA TAQIQLANGAN (01-13 regressiyasi, hotfix bilan yopildi):
    # uvicorn 0.51.0 `_TrustedHosts.always_trust` holatida
    # `get_trusted_client_address()` zanjirning BIRINCHI (chap) elementini
    # qaytaradi. nginx `$proxy_add_x_forwarded_for` bilan mijoz yuborgan
    # qiymat aynan CHAPDA turardi -> `request.client.host` ni mijozning o'zi
    # tanlardi: rate-limit chetlab o'tilardi, istalgan qurbonni qulflash
    # mumkin edi va `audit_log.ip` soxta qiymat yozardi. nginx endi
    # `$remote_addr` bilan USTIGA yozadi (ops/nginx/nginx.conf), bu yerda esa
    # wildcard O'RNIGA tarmoq oralig'i turadi — ikki qatlam mustaqil.
    #
    # ANIQ RO'YXAT bilan uvicorn zanjirni O'NGDAN CHAPGA yuradi va birinchi
    # ISHONCHSIZ hop'da to'xtaydi — to'g'ri algoritm aynan shu.
    #
    # QIYMAT QANDAY TANLANDI (empirik, 2026-07-29):
    #   docker network inspect sbozor_default --format '{{json .IPAM.Config}}'
    #   -> [{"Subnet":"172.19.0.0/16","Gateway":"172.19.0.1"}]
    # Kuzatilgan /16 QADALMAYDI: Docker bridge tarmoqlariga subnetni standart
    # puldan (172.16.0.0/12 -> /16 bo'laklar) DINAMIK beradi, ya'ni tarmoq
    # qayta yaratilsa `sbozor_default` 172.20.x, 172.21.x ... bo'lib qolishi
    # mumkin va qadalgan /16 jimgina ishlamay qo'yardi. Shuning uchun standart
    # — butun pul: 172.16.0.0/12 (172.16.0.0 – 172.31.255.255).
    #
    # Prod'da toraytiring: tarmoqqa aniq subnet bering va `FORWARDED_ALLOW_IPS`
    # ga aynan o'sha /16 ni (yoki nginx konteyneri manzilini) yozing.
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "1"
      - "--proxy-headers"
      - "--forwarded-allow-ips"
      - "${FORWARDED_ALLOW_IPS:-172.16.0.0/12}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:-redis://cache:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-sbozor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sbozor-api}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # NVR rekvizitlarining Fernet kaliti (03-04, SC#4). STANDART QIYMAT
      # ATAYIN YO'Q: `:-` bilan bo'sh qiymat berish ilovani shifrlashsiz
      # ko'tarardi. Berilmasa `Settings` ISHGA TUSHISHDA yiqiladi va xato
      # matni kalit hosil qilish buyrug'ini beradi (T-03-22).
      NVR_CREDENTIAL_KEY: ${NVR_CREDENTIAL_KEY}
      NVR_CREDENTIAL_KEYS_RETIRED: ${NVR_CREDENTIAL_KEYS_RETIRED:-}
      # --- Snapshot ombori (04-01, CAM-07) ---
      #
      # ⚠ `S3_ACCESS_KEY`/`S3_SECRET_KEY` da `:-` BILAN BO'SH STANDART
      # ATAYIN BERILMAGAN — `NVR_CREDENTIAL_KEY` (worker bloki, T-03-22)
      # bilan AYNAN bir xil qaror. Bo'sh standart bilan servis muvaffaqiyatli
      # KO'TARILARDI va xato faqat BIRINCHI KADRNI yuklashda — ya'ni
      # ertalab 06:00 da, hech kim qaramayotgan paytda — chiqardi.
      # Berilmasa `Settings` ISHGA TUSHISHDA yiqiladi (04-04).
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:8333}
      S3_BUCKET: ${S3_BUCKET:-sbozor-snapshots}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Tashkent
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # NVR KASHFIYOTINING FON ISHCHISI (03-06, D-06).
    #
    # ⚠ PROFILSIZ — VA BU ATAYIN. `nvr-sim` va `migrate` dan farqli o'laroq
    # bu ISHLAB CHIQARISH komponenti: `npm run up` uni ham ko'taradi.
    # Profil ortiga yashirilsa `POST /nvr-devices/{id}/discover` 202 qaytarib,
    # yugurish esa MANGU `queued` bo'lib qolardi — hech qanday xato
    # bermasdan (aynan o'sha "jimgina yolg'on" sinfi).
    #
    # TO'RTINCHI KONTEYNER, UCHINCHI SERVIS EMAS: `core-api` kod bazasining
    # boshqa entrypoint'i — `migrate` va `tests` bilan aynan bir xil naqsh,
    # ya'ni CLAUDE.md ning "aynan 3 ta servis" cheklovi buzilmaydi
    # (`03-RESEARCH.md` E.16 va `03-PATTERNS.md` §S-14 ikkalasi ham buni
    # aniq aytadi).
    #
    # `target: runtime` — `migrate`/`tests`/`nvr-sim` `dev` ni ishlatadi.
    # Sabab: worker prod'da ishlaydi, ya'ni unda pytest/ruff/mypy kerak
    # emas va non-root foydalanuvchi (`appuser`, T-01-07) bo'lishi shart.
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    # `--workers 1` — endi bu SAMARADORLIK talabi, KORREKTLIK talabi EMAS
    # (04-07 da yangilandi).
    #
    # 3-fazada bu qator «ikkinchi jarayon cron vazifalarini IKKI MARTA
    # ishga tushirardi» deb yozilgan edi. D-03 o'sha xavfni STRUKTURAVIY
    # ravishda yopdi: tik IDEMPOTENT (`ensure_plan` -> `ON CONFLICT DO
    # NOTHING`, `claim_due` -> `FOR UPDATE SKIP LOCKED` + ijara), ya'ni
    # ikkinchi jarayon dublikat qator ham, dublikat kadr ham yarata
    # olmaydi.
    #
    # Qator SAQLANADI, chunki ikkinchi jarayon ORTIQCHA: u bir xil
    # qatorlar ustida qulf raqobatini va NVR ga qo'shimcha bosimni
    # tug'dirardi, foyda esa nol — kunlik ~175 vazifa bitta jarayonda
    # bemalol bajariladi. Ya'ni bu chegara endi ishonch emas, TEJAMKORLIK.
    #
    # ⚠ `app/jobs/capture.py` ning `_GLOBAL_SEMAPHORES` i JARAYON
    #   darajasida ishlaydi: ikkinchi jarayon global konkurentlik
    #   chegarasini AMALDA ikki barobar qilardi (D-08).
    command: ["taskiq", "worker", "app.worker:broker", "--workers", "1"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:-redis://cache:6379/0}
      # ⚠ `JWT_SECRET` WORKER'GA KERAK EMAS, LEKIN U BUSIZ KO'TARILMAYDI —
      # va bu O'LCHANGAN fakt, taxmin emas:
      #
      #   ValidationError: 1 validation error for Settings
      #   jwt_secret  Field required [type=missing, ...]
      #
      # Sabab: `Settings` — SERVISGA yagona sozlama obyekti va uni har bir
      # entrypoint to'liq quradi. Uni entrypoint bo'yicha bo'lish (masalan
      # `WorkerSettings`) ikki modelning jimgina ajralib ketishiga yo'l
      # ochardi — o'shanda `core-api` bir maydonni qo'shib, worker uni
      # ko'rmay qolardi.
      #
      # Xavfsizlik jihatidan bu YANGI teshik emas: worker allaqachon
      # `NVR_CREDENTIAL_KEY` ni ushlab turadi va `settings.py` ning O'Z
      # izohi aynan uni "yagona eng qimmat sir" deb belgilaydi (JWT kaliti
      # oshkor bo'lsa sessiyalar bekor qilinadi, shifr kaliti oshkor
      # bo'lsa BARCHA NVR parollari ochiladi). Ikkalasi bir xil xost, bir
      # xil image va bir xil ishonch chegarasida.
      JWT_SECRET: ${JWT_SECRET}
      # ⚠ SHIFR KALITI SHU YERDA MAJBURIY (03-04 ning ochiq bandi).
      # Kashfiyot jobi NVR parolini `nvr_credentials` dan o'qiydi va uni
      # `decrypt_nvr_password` bilan ochadi, ya'ni `Settings` bu maydonsiz
      # UMUMAN qurilmaydi va konteyner ishga tushishda
      # `ValidationError: nvr_credential_key Field required` bilan
      # yiqiladi. `:-` bilan bo'sh standart berish esa undan YOMONROQ
      # bo'lardi: worker ko'tarilib, xato faqat birinchi kashfiyotda
      # chiqardi (T-03-22).
      NVR_CREDENTIAL_KEY: ${NVR_CREDENTIAL_KEY}
      NVR_CREDENTIAL_KEYS_RETIRED: ${NVR_CREDENTIAL_KEYS_RETIRED:-}
      # --- Snapshot ombori (04-01, CAM-07) — `core-api` bloki bilan bir xil ---
      # Kadr olish va saqlash siyosati AYNAN shu jarayonda ishlaydi, ya'ni
      # sirlar bu yerda ham majburiy va `:-` bilan bo'sh standart YO'Q.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:8333}
      S3_BUCKET: ${S3_BUCKET:-sbozor-snapshots}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # --- Telegram alertlari (04-08, FOUND-06) ---
      #
      # ⚠ BU IKKISI YUQORIDAGI S3 KALITLARIDAN TESKARI: `:-` bilan bo'sh
      # standart ATAYIN beriladi. Bo'sh token — QONUNIY holat: «alertlar
      # o'chiq» degani va u `log.warning` bilan bir marta e'lon qilinadi.
      # Sabab operatsion: bot tokeni bozorga o'rnatishdan OLDIN ba'zan
      # mavjud bo'lmaydi va o'shanda kadr olish TO'XTAMASLIGI kerak —
      # alertsiz kadr alertli kadrsizlikdan yaxshiroq (D-19, §S-11).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Tashkent
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    # DIQQAT: xost portiga publish QILINMAYDI — worker HTTP yuzasi bermaydi.
    restart: unless-stopped

  scheduler:
    # SNAPSHOT QUVURINING PLANERI (04-01/04-07, D-02, W0-3).
    #
    # ⚠⚠ PROFILSIZ — VA BU BU BLOKDAGI ENG MUHIM QATOR. `worker` bilan
    # bir xil sabab, lekin oqibati BATTAR: planer profil ortida qolsa
    # kunlik reja HECH QACHON materializatsiya bo'lmasdi va HECH QANDAY
    # XATO CHIQMASDI — `docker compose ps` toza, jurnal bo'sh, jadval
    # jimgina bo'sh. Bu «jimgina yolg'on» sinfining eng qimmat namunasi:
    # nosozlik faqat kun oxirida, hisobot bo'sh chiqqanda sezilardi.
    #
    # YETTINCHI KONTEYNER, UCHINCHI SERVIS EMAS: `core-api` kod bazasining
    # boshqa entrypoint'i — `worker`, `migrate` va `tests` bilan aynan bir
    # xil naqsh (`target: runtime`, boshqa `command`).
    #
    # D-02: planer FAQAT holatsiz 1-daqiqalik tik beradi. Reja, ijara
    # (lease), idempotentlik va yo'qlik yozuvi Postgres `capture_runs` da
    # yashaydi. taskiq'ning cron holati (`SchedulerLoop.cron_tasks_last_run`)
    # — jarayon xotirasidagi oddiy `dict`, taqsimlangan qulf yo'q.
    # `RedisScheduleSource` ham yaroqsiz: `cache` `--save "" --appendonly no`
    # bilan ishlaydi, ya'ni qayta ko'tarilganda hamma bozorning jadvali
    # jimgina yo'qolardi.
    #
    # D-03: tik IDEMPOTENT, shuning uchun taskiq'ning uchala nosozlik
    # rejimi (dublikat ishga tushish, o'tkazib yuborish, qayta ishga
    # tushish) zararsiz — «aynan bitta planer» operatsion talabi YO'Q.
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    # ⚠ `app.worker:scheduler` obyekti 04-07 da tug'iladi (`app/worker.py`
    # o'sha rejaning fayli). Konteyner ta'rifi ATAYIN OLDIN yoziladi —
    # W0-3 ning butun mazmuni «profilsizlik migratsiyadan va koddan OLDIN
    # qulflansin» degani. Shu sababli `docker compose up scheduler` 04-07
    # gacha import xatosi beradi; `docker compose config` esa bugundan
    # profilsizlikni isbotlaydi (`tests/unit/test_storage_config.py`).
    command: ["taskiq", "scheduler", "app.worker:scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:-redis://cache:6379/0}
      # `worker` bloki bilan bir xil sabab (`Settings` — SERVISGA yagona
      # sozlama obyekti va uni har bir entrypoint TO'LIQ quradi).
      JWT_SECRET: ${JWT_SECRET}
      NVR_CREDENTIAL_KEY: ${NVR_CREDENTIAL_KEY}
      NVR_CREDENTIAL_KEYS_RETIRED: ${NVR_CREDENTIAL_KEYS_RETIRED:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:8333}
      S3_BUCKET: ${S3_BUCKET:-sbozor-snapshots}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Tashkent
    depends_on:
      cache:
        condition: service_healthy
    # =====================================================================
    # ⚠⚠ `healthcheck` ATAYIN YOZILMAGAN — VA U SOXTALASHTIRILMAYDI.
    #
    # `taskiq scheduler` HTTP yuzasi bermaydi, jarayon tirikligi esa
    # «tik ketyaptimi?» savoliga JAVOB BERMAYDI. Aynan shu nosozlik sinfi
    # 3-fazada o'lchangan (`worker.py:136-144`): konteyner `Up`,
    # `docker compose ps` sog'lom ko'rsatadi va BIRORTA vazifa hech qachon
    # bajarilmaydi. `CMD true` yoki `pgrep taskiq` kabi healthcheck
    # aynan o'sha holatni «sog'lom» deb belgilab, YOLG'ON ISHONCH berardi.
    #
    # Yagona ishonchli signal — BAZADAGI natija. U `alert_sweep` va
    # `/internal/self-check` zimmasida (04-07/04-08), konteyner
    # healthcheck'ida emas (RESEARCH Pitfall 14).
    # =====================================================================
    # DIQQAT: xost portiga publish QILINMAYDI — planer HTTP yuzasi bermaydi.
    restart: unless-stopped

  go2rtc:
    # JONLI KO'RISHNING MEDIA SERVERI (03-07, CAM-03).
    #
    # ⚠ PROFILSIZ — `worker` bilan bir xil sabab: bu ISHLAB CHIQARISH
    # komponenti va `npm run up` uni ham ko'taradi. Profil ortiga
    # yashirilsa `POST /cameras/{id}/live-token` 503 qaytarardi va
    # sabab «tarmoq nosozligi» bo'lib ko'rinardi.
    #
    # BESHINCHI KONTEYNER, TO'RTINCHI SERVIS EMAS: go2rtc — TAYYOR
    # image, biz yozgan kod emas (`nginx`, `db`, `cache` bilan bir xil
    # toifa). CLAUDE.md ning «aynan 3 ta servis» cheklovi BIZNING
    # servislarimizga tegishli va u buzilmaydi.
    image: alexxit/go2rtc:1.9.14
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      # ⚠ `:ro` MAJBURIY. go2rtc `PATCH /api/config` bilan o'z YAML'iga
      # YOZA OLADI va o'sha yo'l `exec:` ni faylga muhrlab qo'yardi —
      # ya'ni RCE qayta ishga tushirishdan keyin ham SAQLANIB qolardi.
      # Faqat-o'qish mount bu yo'lni butunlay yopadi (D-11).
      - ./ops/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    # =====================================================================
    # ⚠⚠ `ports:` BLOKI ATAYIN YO'Q — VA U QO'SHILMAYDI.
    #
    # go2rtc ning HTTP API'si (1984) `PUT /api/streams?src=exec:<buyruq>`
    # bilan konteynerda root sifatida IXTIYORIY BUYRUQ bajaradi
    # (GHSA-wwww-5h25-jf98, CVSS 9.1). Portni xostga publish qilish shu
    # yuzani internetga ochardi.
    #
    # WebRTC ning UDP 8555 i ham SHU YERDA emas, FIREWALL darajasida
    # ochiladi (`03-PATTERNS.md` §3.11): compose `ports:` bandi Docker'ning
    # `iptables` qoidalarini yozadi va u host firewall'ini CHETLAB O'TADI —
    # ya'ni «UFW da yopiq» degan ishonch yolg'on bo'lib qolardi.
    #
    # Media yo'li: brauzer -> nginx `/live/...` (auth_request) -> go2rtc.
    # =====================================================================
    healthcheck:
      # `/api/streams` EMAS: healthcheck aynan biz bloklayotgan yuzani
      # so'rab turardi va u konfiguratsiyada «bu yo'l normal» degan
      # taassurot qoldirardi. `nc` port ochiqligini tekshiradi — bu
      # «jarayon tirikmi?» savoliga to'liq javob (`nvr-sim-rtsp` bilan
      # bir xil qaror).
      test: ["CMD", "nc", "-z", "127.0.0.1", "8554"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    # `frontend/Dockerfile` 01-02 rejasida yaratiladi — shu sababli profil ortida,
    # aks holda `npm run up` build xatosi berardi.
    profiles: ["web"]
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      TZ: ${TZ:-Asia/Tashkent}
    depends_on:
      - core-api
    restart: unless-stopped

  nginx:
    profiles: ["proxy"]
    image: nginx:1.30.4-alpine
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_HOST_PORT:-8080}:80"
    restart: unless-stopped

  nvr-sim:
    # SIMULYATSIYA QILINGAN HIKVISION NVR (CAM-09).
    #
    # `profiles: ["sim"]` — bu YAGONA va STRUKTURAVIY himoya (T-03-07):
    # prod deploy profilsiz ishlaydi, ya'ni profilsiz `docker compose up`
    # bu konteynerni umuman KO'RMAYDI. Intizomga (".env da o'chirib qo'yamiz")
    # tayanadigan yechim ertami-kechmi buziladi, profil esa buzilmaydi.
    #
    # `core-api` Dockerfile'ining `dev` target'i QAYTA ISHLATILADI (B.9):
    # yangi Dockerfile yo'q, CI'da yangi build qatlami yo'q, yangi paket yo'q.
    # Bu TO'RTINCHI KONTEYNER, uchinchi servis emas — `migrate` va `tests`
    # bilan aynan bir xil naqsh, ya'ni CLAUDE.md ning "aynan 3 ta servis"
    # cheklovi buzilmaydi.
    profiles: ["sim"]
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    # ⚠ `--no-date-header` MAJBURIY. uvicorn o'z `Date` sarlavhasini ASGI
    # javobidan OLDIN qo'yadi; sim esa siljitilgan `Date` ni qo'yadi (A.3
    # soat-farqi yo'lining yagona sinov vositasi). Bayroqsiz javobda IKKITA
    # `Date` bo'lardi, `httpx` ularni vergul bilan qo'shib berardi va
    # `parsedate_to_datetime` yiqilardi — ya'ni drift o'lchovi jimgina
    # ishlamay qolardi.
    #
    # `--workers` BERILMAYDI: holat jarayon xotirasida yashaydi va ikkinchi
    # ishchi bo'lsa `POST /__sim__/state` ularning faqat bittasiga tegardi.
    command:
      - "uvicorn"
      - "sim.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--no-date-header"
    working_dir: /app/services/nvr-sim
    environment:
      # D-09: CI'da 6 kanal (tez, `DS-7616NI-K2` fixture'iga mos). 25 kanal —
      # alohida sekin test va u konteynerni qayta ko'tarmasdan, ish paytida
      # `POST /__sim__/state {"channel_count": 25}` bilan o'rnatiladi.
      SIM_CHANNEL_COUNT: "${SIM_CHANNEL_COUNT:-6}"
      #
      # ⚠ BU YERDA «RTSP XOSTI» KALITI YO'Q — VA U QAYTA QO'SHILMAYDI.
      #
      # Ilgari shu blokda ikkita kalit turardi: RTSP serverining alohida
      # konteyner nomi va uning porti. Ularni HECH KIM o'qimasdi
      # (03-VERIFICATION GAP-1: «RTSP oyog'i hech qachon ulanmaganining
      # bevosita dalili»). Sabab tuzatilganda kalitlarga ehtiyoj ham
      # yo'qoldi: to'g'ri modelda alohida «RTSP xosti» tushunchasi UMUMAN
      # MAVJUD EMAS — RTSP NVR'ning O'Z manzilida turadi, xuddi real
      # qurilmadagidek (`nvr-sim-rtsp` xizmati, `network_mode`).
      #
      # Takrorlanishi `tests/unit/test_compose_sim_env.py` bilan to'silgan:
      # compose'dagi HAR BIR `SIM_*` kalitining iste'molchisi bo'lishi shart.
      #
      # `adminAccesses` javobida E'LON QILINADIGAN port (A.2). U tinglash
      # portidan ATAYIN ajratilgan: `port_moved` stsenariysi aynan
      # "e'lon qilingan port 554 emas" holatini sinaydi.
      SIM_RTSP_PORT_ADVERTISED: "${SIM_RTSP_PORT_ADVERTISED:-554}"
      SIM_USERNAME: "${SIM_USERNAME:-admin}"
      SIM_PASSWORD: "${SIM_PASSWORD:-Sim12345}"
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - .:/app
    healthcheck:
      # Nishon ATAYIN `/__sim__/state`: u Digest talab qilmaydi va
      # `mode="slow"` da HECH QACHON kechiktirilmaydi. `/ISAPI/*` ni
      # tekshirsak, `slow` yoki `bad_password` testi konteynerni
      # `unhealthy` qilib butun stack'ni yiqitardi.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8080/__sim__/state')
      interval: 5s
      timeout: 3s
      retries: 10
    # DIQQAT: xost portiga publish QILINMAYDI (T-01-04, T-03-12) — ichki test
    # yuzasi tarmoqqa ochilmaydi; sim faqat compose tarmog'idan ko'rinadi.

  nvr-sim-rtsp:
    # SIM NVR'NING RTSP OYOG'I (CAM-09, CAM-03; 03-VERIFICATION GAP-1).
    #
    # =====================================================================
    # ⚠⚠ `network_mode: service:nvr-sim` — BU REJANING MARKAZIY QARORI,
    #    QULAYLIK EMAS.
    #
    # Real NVR'da ISAPI ham, RTSP ham BITTA manzilda yashaydi. Kashfiyot
    # `rtsp://<nvr_devices.host>:<kashf-etilgan-port>/Streaming/Channels/<id>`
    # ni quradi, ya'ni xost ISAPI so'ralgan xost bilan AYNAN BIR XIL.
    # Ilgari RTSP alohida konteynerda (`go2rtc-sim`), alohida xostda va
    # `sim_cam_01…06` degan BOSHQA nomlar bilan turardi — mahsulot
    # yo'lidan boradigan test yozilgan taqdirda ham ulanadigan joyi yo'q
    # edi. Tarmoq fazasini bo'lishish shu bo'shliqni tuzilma darajasida
    # yopadi: `nvr-sim:554` aynan shu serverga tushadi.
    #
    # `network_mode` ishlatilgani uchun bu xizmatda:
    #   * `ports:`    YOZILMAYDI — netns `nvr-sim` niki, u esa publish
    #                 qilinmagan (T-01-04, T-03-12);
    #   * `networks:` YOZILMAYDI — compose ikkalasini birga qabul qilmaydi;
    #   * `depends_on:` KERAK EMAS — `network_mode: service:` bog'liqlikni
    #                 o'zi hosil qiladi.
    # =====================================================================
    #
    # ⚠ IMAGE DIGEST BILAN QADALGAN (T-03-82, T-03-SC). Teg ko'chirilishi
    #   mumkin, digest — yo'q. Ta'minot zanjiri tekshiruvi (2026-08-03):
    #   `bluenviron/mediamtx` — MIT, arxivlanmagan, 19 711 yulduz, oxirgi
    #   release `v1.19.3` (2026-07-23). Faqat `--profile sim` ostida
    #   ishlaydi va prodga hech qachon chiqmaydi.
    #
    # ⚠ D-11: `runOnDemand` buyrug'i FAQAT `:ro` mount qilingan STATIK
    #   configdan keladi; `api:` konfiguratsiyada butunlay o'chirilgan,
    #   ya'ni ish paytida buyruq yozish yo'li YO'Q.
    profiles: ["sim"]
    image: bluenviron/mediamtx:1.19.3-ffmpeg@sha256:e8eda6a884bbb2eaebf0c0454200ddc8087f428e091bae10d20e330a08558778
    network_mode: "service:nvr-sim"
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      # `:ro` MAJBURIY — server o'z konfiguratsiyasini QAYTA YOZA OLMASLIGI
      # kerak (go2rtc'dagi `PATCH /api/config` sinfidagi yo'l).
      - ./ops/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      # 554 ga TCP ulanish — «jarayon tirikmi?» savoliga to'liq javob.
      # `-ffmpeg` variant Alpine asosida va busybox `nc` ni beradi.
      test: ["CMD", "nc", "-z", "127.0.0.1", "554"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    command: ["pytest", "-q"]
    environment:
      # testcontainers konteyner ichidan Docker'ni boshqaradi (docker-outside-of-docker):
      # ishga tushirilgan Postgres xost portiga publish qilinadi, biz unga
      # host.docker.internal orqali boramiz.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Sim testlari (`-m sim`) unga HAQIQIY TCP orqali boradi — `ASGITransport`
      # EMAS. Sabab: `ASGITransport` tarmoqni chetlab o'tadi, ya'ni "kod NVR
      # bilan gaplasha oladi" da'vosi umuman sinalmasdan qolardi. Konteyner
      # ko'tarilmagan bo'lsa `sim_url` fixture'i CI'da `fail` beradi (skip emas).
      NVR_SIM_BASE_URL: "http://nvr-sim:8080"
      SIM_USERNAME: "${SIM_USERNAME:-admin}"
      SIM_PASSWORD: "${SIM_PASSWORD:-Sim12345}"
      # `-m sim` ostidagi ombor testlari (04-06/04-08) HAQIQIY SeaweedFS
      # konteyneriga boradi — S3 mock'i ishlatilmaydi. Sabab 03-14 da
      # o'lchangan: mock'langan qatlam «kod ombor bilan gaplasha oladi»
      # da'vosini umuman sinamaydi va yashil bo'lib turaveradi.
      #
      # ⚠ BU YERDA `:-` BILAN STANDART BERILGAN va bu `core-api`/`worker`
      # bloklaridan ATAYIN farq qiladi: sim rekviziti SIR EMAS, u test
      # uskunasining qismi (`SIM_PASSWORD` bilan aynan bir xil qaror).
      # Prod bloklarida esa bo'sh standart yiqilishni deploy paytiga
      # surib qo'yardi.
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://storage:8333}"
      S3_BUCKET: "${S3_BUCKET:-sbozor-snapshots}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-sbozor-local-access-key}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-sbozor-local-secret-key}"
      CI: "${CI:-}"
      TZ: Asia/Tashkent
    # =====================================================================
    # ⚠ `storage` BOG'LIQLIGI E'LON QILINGAN (04-12, 04-06 ning ochiq bandi).
    #
    # O'lchangan holat: `storage` ko'tarilmagan bo'lsa yalang'och
    # `npm run test` 16 ta testni HARD FAIL bilan yiqitadi (`s3_client`
    # fixture'i bucketga yeta olmaydi). `npm run gate` buni qoplaydi —
    # u `sim:up` bilan boshlanadi — lekin `npm run test` ni to'g'ridan-
    # to'g'ri chaqirgan dasturchi sababni faqat 16 ta stack trace'dan
    # o'qib topardi.
    #
    # ⚠ `db`/`cache` bu yerda YO'Q va bu ATAYIN: baza testcontainers bilan
    # test jarayonining O'ZI tomonidan ko'tariladi (`tests/conftest.py::
    # pg_container`), ya'ni compose darajasida ularga bog'lanish ikkinchi,
    # ishlatilmaydigan Postgres ko'tarardi.
    #
    # ⚠ `nvr-sim` ham YO'Q: u `sim` profilida va uning yo'qligi TO'G'RI
    # xulqqa ega — `sim_url` fixture'i dev mashinasida `skip`, CI'da
    # `fail` beradi (`tests/fixtures/nvr_sim.py`). Bu farq ataylab
    # saqlanadi.
    # =====================================================================
    depends_on:
      storage:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  # SeaweedFS ning master + volume + filer holati. NOMLANGAN VOLUME
  # (bind mount emas): dalil arxivi konteyner qayta qurilganda ham
  # saqlanib qolishi shart va u `pgdata` bilan bir xil toifada — 8-fazadagi
  # zaxira nusxa siyosati ikkalasini ham qamraydi.
  seaweed:
