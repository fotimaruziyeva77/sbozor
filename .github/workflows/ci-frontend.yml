name: ci-frontend

# DIQQAT: bu fayl 01-01 rejasidagi `ci-backend.yml` dan ATAYIN alohida —
# ikkala reja bir to'lqinda ishlaydi va bitta faylga tegmasligi kerak.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: lint · typecheck · i18n · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lock fayl bo'yicha)
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Transliterator testlari
        run: npm --prefix frontend test

      # Ikki darvoza: (1) uz-Cyrl.json drift bermaydi, (2) uchala faylda
      # kalit va ICU argument to'plamlari aynan mos (T-01-09 / Pitfall 8).
      - name: i18n darvozalari
        run: npm --prefix frontend run i18n:check

      - name: Build
        run: npm --prefix frontend run build
