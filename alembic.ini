# SBOZOR — Alembic konfiguratsiyasi.
#
# Migratsiyalar HECH QACHON ilova startupida ishlamaydi — ular alohida
# one-shot job (`compose.yaml` dagi `migrate` profili) sifatida `sbozor_owner`
# roli bilan bajariladi.

[alembic]
script_location = migrations

# Repo ildizi sys.path ga qo'shiladi: migratsiya fayllari `migrations.helpers`
# va `migrations.entities` ni, env.py esa `sbozor_core` ni shu orqali topadi.
prepend_sys_path = .

path_separator = os

# Sanasiz, ketma-ket nom: `0001_identity.py`, `0002_audit.py`, ...
# Fayl nomi tartibi migratsiya tartibiga mos keladi (sana prefiksi bilan
# bunday bo'lmaydi va `ls` chiqishi tarixni yashiradi).
file_template = %%(rev)s_%%(slug)s

# ATAYIN BO'SH: ulanish satri `migrations/env.py` da MIGRATION_DATABASE_URL
# muhit o'zgaruvchisidan o'qiladi. Sir hech qachon repoda saqlanmaydi va
# noto'g'ri (masalan ilova yoki superuser) rol bilan migratsiya qilib
# bo'lmaydi — URL har doim aniq beriladi.
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Logging (fileConfig uchun majburiy bo'limlar)
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
