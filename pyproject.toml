# SBOZOR — repo ildizi: FAQAT vosita konfiguratsiyasi.
#
# `[project]` bo'limi ATAYIN YO'Q — uv bu katalogni loyiha deb hisoblamasligi
# kerak. Har bir servis o'z `pyproject.toml` + `uv.lock` iga ega (aiogram
# pydantic/redis pin konflikti shuni talab qiladi).

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Sessiya doirasidagi async fixture'lar (`app_engine`) va ularni ishlatadigan
# testlar AYNAN BIR event loop'da bo'lishi shart — aks holda asyncpg ulanishi
# boshqa loop'ga bog'lanib qoladi va test "loop is closed" bilan yiqiladi.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# `.`                  -> `migrations` paketi (helpers, entities) testlardan
#                         import qilinadi; Alembic ham `prepend_sys_path = .`
#                         bilan aynan shu yo'lni ishlatadi.
# `tests`              -> `fixtures` paketi (seed'lar va umumiy fixture tiplari).
# `services/core-api`  -> `app` paketi (FastAPI ilovasi). Servis kodi o'z
#                         katalogida yashaydi, testlar esa repo ildizida —
#                         busiz `import app.security.rbac` topilmaydi. Aynan
#                         shu yo'lni `mypy_path` va Dockerfile'ning
#                         `WORKDIR /app/services/core-api` i ham ishlatadi.
# Bu ATAYIN aniq yozilgan: pytest'ning rootdir'ga qarab sys.path ni o'zi
# to'ldirishi test faylining qayerda turishiga bog'liq va jimgina o'zgaradi.
pythonpath = [".", "tests", "services/core-api"]
# ⚠ `-m "not hardware"` STANDART HOLAT (03-11). Real qurilma talab qiladigan
#   to'plam (`tests/integration/test_real_nvr.py`) FAZANI BLOKLAMAYDI —
#   ROADMAP ning self-service qoidasi: «tashqi bog'liqlik hech qachon
#   `Blocks:` bo'lmaydi». Filtr AYNAN SHU YERDA, `package.json` da emas:
#   `npm run test` ham, xostdagi yalang'och `pytest` ham, IDE ham bir xil
#   standartni olishi kerak — uchta joyda takrorlangan filtr ikkitasida
#   unutilardi.
#
#   Buyruq qatoridagi `-m` bu qiymatni TO'LIQ ALMASHTIRADI (pytest'da `-m`
#   `store` turidagi opsiya), ya'ni `pytest -m hardware` va
#   `pytest -m "sim and not slow"` kutilgandek ishlaydi. O'lchandi:
#   `-m hardware --collect-only` -> 5 test, `-m "not hardware"` -> 0.
addopts = "-q --strict-markers -m \"not hardware\""
markers = [
    "tenancy: tenant izolyatsiyasi (RLS) invariantlari — faza darvozasi, majburiy yashil",
    # 3-FAZA. `--strict-markers` ostida e'lon qilinmagan marker YIG'ILISH
    # paytida yiqiladi ("unknown marker"), ya'ni `-m sim` yozgan zahoti
    # butun to'plam qizarardi va sabab test mantig'ida emas, shu ro'yxatda
    # bo'lardi. Shuning uchun markerlar simulyator KODIDAN OLDIN e'lon
    # qilinadi (W0-5).
    "sim: simulyatsiya qilingan Hikvision NVR ustidagi uchidan-uchiga testlar (CAM-09) — `--profile sim` talab qiladi",
    "hardware: faqat real NVR bilan ishlaydigan testlar — CI'da `-m \"not hardware\"` bilan chetlab o'tiladi, fazani BLOKLAMAYDI",
    "slow: uzoq davom etadigan sim stsenariylari (25 kanal) — standart `test:sim` zanjiridan chetda, `npm run test:sim:slow` bilan ishga tushadi",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "node_modules", ".planning", "frontend", ".next"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Testlarda `assert` — pytest'ning asosiy mexanizmi.
# S105/S106: test fixture'laridagi dev parol literallari (haqiqiy sir emas).
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["^frontend/", "^\\.planning/"]
# `tests/fixtures` paketi test modullaridan `fixtures.*` sifatida, `app` esa
# `services/core-api` dan import qilinadi (pytest `pythonpath` bilan bir xil yo'l).
mypy_path = "tests:services/core-api"

[[tool.mypy.overrides]]
# `py.typed` YO'Q paketlar (o'lchandi: uchalasida ham marker fayli yo'q).
# `openpyxl`/`xlsxwriter`/`defusedxml` uchun rasmiy stub paketlari alohida
# yashaydi (`types-*`) va ular AYRIM versiyalarda kutubxonadan orqada
# qoladi — shuning uchun bu yerda "stub yo'q" deb tan olinadi, chaqiruv
# joylari esa `Any` bilan ishlaydi va qaytariladigan qiymat DARHOL o'z
# tipimizga (`SheetRow`, `bytes`) o'giriladi.
module = ["testcontainers.*", "alembic_utils.*", "openpyxl.*", "xlsxwriter.*", "defusedxml.*"]
ignore_missing_imports = true
