# SBOZOR — reverse proxy. BITTA DOMEN topologiyasi.
#
# Qaror (RESEARCH Open Question 3, hal qilindi): frontend va API bitta origin
# ostida turadi — `/api/` -> core-api, qolgani -> frontend. Shu sababli refresh
# cookie uchun `SameSite=Lax` + `Path=/api/v1/auth` yetarli va alohida CSRF
# double-submit token qurish shart emas.
#
# TLS bu fazada YO'Q (RESEARCH A7) — dev/pilot uchun HTTP. Let's Encrypt
# keyingi fazada certbot `--webroot` bilan qo'shiladi.
#
# =============================================================================
# X-Forwarded-For: USTIGA YOZILADI, QO'SHILMAYDI — bu xavfsizlik cheklovi.
#
# `$proxy_add_x_forwarded_for` mijoz YUBORGAN sarlavhaga `$remote_addr` ni
# qo'shadi, ya'ni zanjirning CHAP tomonini mijozning O'ZI to'ldiradi:
#     mijoz  -> `X-Forwarded-For: 1.2.3.4`
#     nginx  -> `X-Forwarded-For: 1.2.3.4, <haqiqiy peer>`
# uvicorn `--forwarded-allow-ips *` ostida (`_TrustedHosts.always_trust`)
# `get_trusted_client_address()` aynan BIRINCHI elementni qaytaradi, ya'ni
# `request.client.host == "1.2.3.4"` — to'liq hujumchi nazoratida.
#
# Oqibati CR-04 tuzatmoqchi bo'lgan nuqsondan OG'IRROQ:
#   1) rate-limit CHETLAB O'TILADI — har so'rovga yangi soxta IP yozib
#      `rl:login:ip:*` chegarasidan butunlay qutuladi (cheksiz parol terish);
#   2) MAQSADLI QULFLASH — qurbonning haqiqiy IP'sini yozib uni 15 daqiqaga
#      qulflaydi;
#   3) `audit_log.ip` hujumchi TANLAGAN qiymatni yozadi — "kim qildi"
#      dalili qalbakilashadi (FOUND-03).
#
# `$remote_addr` esa mijoz yuborgan har qanday `X-Forwarded-For` ni TASHLAB
# YUBORADI va aynan BITTA element — nginx ko'rgan haqiqiy peer — qoldiradi.
#
# BU OVERWRITE BO'LIB QOLISHI SHART. Agar oldinga ISHONCHLI upstream proxy
# (CDN yoki L7 balanser) qo'yilsa, ishonchli hop soni va uvicorn'ning
# `--forwarded-allow-ips` ro'yxati BIRGALIKDA qayta ko'rib chiqiladi —
# faqat bittasini o'zgartirish soxtalashtirish teshigini qayta ochadi.
#
# Darvoza: `tests/integration/test_rate_limit_proxy.py` bu faylni O'QIYDI va
# `$proxy_add_x_forwarded_for` qaytarilsa qizaradi.
# =============================================================================

# =============================================================================
# go2rtc — D-11: HTTP API'si FOYDALANUVCHIGA HECH QACHON OCHILMAYDI.
#
# Frigate loyihasidagi ogohnoma (GHSA-wwww-5h25-jf98, CVSS 9.1) aynan shu
# yuzaga tegishli: `PUT /api/streams?src=exec:<buyruq>` go2rtc konteynerida
# root sifatida IXTIYORIY BUYRUQ bajaradi. Ya'ni bu yo'llarning ochilishi —
# masofaviy kod ijrosi, "konfiguratsiya sizishi" emas.
#
# Bu fayl — himoyaning IKKINCHI qatlami. Birinchisi: go2rtc porti xost
# portiga umuman publish qilinmaydi (`compose.yaml`). Uchinchisi:
# `app/services/go2rtc.py::assert_safe_go2rtc_src` — `core-api` ning O'ZI
# ham `rtsp://` dan boshqa manba yubora olmaydi.
#
# ⚠ QUYIDAGI IKKI BLOK BIR-BIRINI ALMASHTIRMAYDI:
#     1) `^/(api/streams|api/config|api/restart)` — to'g'ridan-to'g'ri yo'l;
#     2) `^/live/api/(streams|config|restart)`   — `/live/` prefiksi orqali.
#   Ikkinchisisiz `/live/` bloki go2rtc'ga prefiksni OLIB TASHLAB uzatgani
#   uchun `/live/api/streams` xuddi o'sha API'ga yetib borardi. Bitta
#   blokni "ortiqcha" deb olib tashlash ikkinchisini chetlab o'tish
#   yo'lini ochadi.
#
# ⚠ `/live/` NING O'ZI HAM ALLOW-LIST: faqat signalling va oqim yo'llari
#   sanaladi. Qora ro'yxat go2rtc ning keyingi versiyasida yangi endpoint
#   paydo bo'lganda jimgina eskirardi.
# =============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # --- D-11, 1-blok: go2rtc API'sining to'g'ridan-to'g'ri yo'li ---
    location ~ ^/(api/streams|api/config|api/restart) {
        return 403;
    }

    # --- D-11, 2-blok: o'sha API'ning `/live/` orqali yo'li ---
    location ~ ^/live/api/(streams|config|restart) {
        return 403;
    }

    # --- Jonli ko'rish: avtorizatsiya nginx'da, media go2rtc'dan ---
    #
    # `auth_request` HAR SO'ROVDA `core-api` ga boradi va u faqat STATUSGA
    # qaraydi (204 -> o'tkazadi, 403 -> rad etadi). go2rtc'da bozor
    # tushunchasi YO'Q — unda faqat global Basic-auth bor, ya'ni uni
    # to'g'ridan-to'g'ri ochish A bozori direktoriga B bozori kamerasini
    # berardi (T-03-46).
    #
    # Ro'yxat ATAYIN qisqa: `api/ws` — WebRTC/MSE signalling, qolgani HLS
    # zaxira yo'li. `frame.jpeg` 4-fazadagi kadr olish uchun EMAS (u ichki
    # tarmoqdan boradi) — u dala diagnostikasi uchun.
    location ~ ^/live/(api/ws|api/webrtc|api/frame\.jpeg|api/stream\.m3u8|api/hls/.+)$ {
        auth_request /internal/live-authz;

        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://go2rtc:1984;
        proxy_http_version 1.1;

        # WebSocket signalling (WebRTC va MSE ikkalasi ham `/api/ws` dan).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # Jonli oqim uzoq ochiq turadi — standart 60 s uni har daqiqada
        # uzardi va UI buni "tarmoq nosozligi" deb ko'rsatardi.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # --- `auth_request` NISHONI — FAQAT ICHKI SUBSO'ROV ---
    #
    # `internal;` bu yo'lni tashqi so'rov uchun 404 qiladi. Bu ikkinchi
    # qatlam: marshrutning O'ZI ham tokensiz so'rovga 403 beradi
    # (`app/api/internal/live_authz.py`), ya'ni himoya nginx
    # konfiguratsiyasiga BOG'LIQ EMAS.
    #
    # `X-Original-URI` — asl so'rovning TO'LIQ yo'li (query bilan): token
    # ham, `src` ham o'sha yerda va `core-api` ikkalasining MOSLIGINI
    # tekshiradi. Tana uzatilmaydi (`GET` subso'rovida u baribir yo'q).
    location = /internal/live-authz {
        internal;
        proxy_pass http://core-api:8000/internal/live-authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        proxy_pass http://core-api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE (fayl boshidagi izohga qarang) — `$proxy_add_x_forwarded_for`
        # mijozga zanjirning chap tomonini yozish imkonini berardi.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        # Next.js dev/HMR va kelajakdagi WebSocket oqimlari uchun.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE (fayl boshidagi izohga qarang) — ikkala location BIR XIL
        # bo'lishi shart, aks holda frontend yo'li orqali soxtalashtirish ochiq
        # qolardi.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
