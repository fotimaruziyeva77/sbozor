<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001 — Kassir vau-oqimi</title>
<link rel="stylesheet" href="../themes/default.css" id="theme-link">
<style>
  body { padding-top: 52px; }
  /* Variant tab bar */
  #variant-nav { position:fixed; top:0; left:0; right:0; z-index:9998;
    background:var(--color-surface); border-bottom:1px solid var(--color-border);
    padding:8px 16px; display:flex; gap:8px; align-items:center; }
  .variant-tab { border:1px solid var(--color-border); background:var(--color-surface);
    color:var(--color-text-muted); padding:6px 14px; border-radius:var(--radius-md);
    font:600 12px var(--font-sans); cursor:pointer; transition:all var(--motion-fast) var(--ease-out); }
  .variant-tab:hover { border-color:var(--color-border-ui); color:var(--color-text); }
  .variant-tab.active { background:var(--color-accent); border-color:var(--color-accent); color:var(--color-accent-fg); }
  .variant { display:none; } .variant.active { display:block; }

  /* Kassir ekrani */
  .phone { max-width:420px; margin:24px auto; background:var(--color-surface);
    border:1px solid var(--color-border); border-radius:24px; overflow:hidden;
    box-shadow:var(--shadow-raised); }
  .phone-head { display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px; border-bottom:1px solid var(--color-border); }
  .phone-head .who { font-weight:600; font-size:13px; }
  .today { text-align:right; }
  .today .lbl { font-size:11px; color:var(--color-text-muted); }
  .today .val { font-weight:700; font-size:14px; color:var(--color-success-text); }
  .phone-body { padding:20px; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--color-border-ui);
    border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:16px;
    transition:box-shadow var(--motion-fast) var(--ease-out), border-color var(--motion-fast); }
  .search:focus-within { border-color:var(--color-accent); box-shadow:0 0 0 3px oklch(0.56 0.19 255 / 0.15); }
  .search input { border:0; outline:0; flex:1; font:inherit; background:transparent; color:inherit; }
  .stall-card { position:relative; border:1px solid var(--color-border); border-radius:var(--radius-lg);
    padding:20px; text-align:center; }
  .stall-num { font-size:13px; color:var(--color-text-muted); }
  .stall-name { font-weight:600; font-size:16px; margin:2px 0 12px; }
  .sum-lbl { font-size:12px; color:var(--color-text-muted); }
  .sum { font-size:var(--text-display); font-weight:700; letter-spacing:-0.5px; margin:2px 0 16px; }
  .sum small { font-size:18px; font-weight:600; color:var(--color-text-muted); }
  .paytype { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
  .paytype button { flex:1; max-width:130px; padding:10px 0; border-radius:var(--radius-md);
    border:1px solid var(--color-border-ui); background:var(--color-surface); font:600 13px var(--font-sans);
    color:var(--color-text); cursor:pointer; transition:all var(--motion-fast) var(--ease-out); }
  .paytype button.sel { background:var(--color-accent); border-color:var(--color-accent); color:var(--color-accent-fg); }
  .confirm { position:relative; width:100%; padding:16px 0; font:700 16px var(--font-sans);
    background:var(--color-accent); color:var(--color-accent-fg); border:0;
    border-radius:var(--radius-md); cursor:pointer; overflow:hidden;
    transition:transform 100ms var(--ease-out), background var(--motion-fast); }
  .confirm:hover { background:var(--color-accent-hover); }
  .confirm:active { transform:scale(0.97); }
  .confirm.done { background:var(--color-success); }
  .confirm .btxt { transition:opacity 120ms; }
  .confirm.done .btxt { opacity:0; }
  .confirm svg { position:absolute; inset:0; margin:auto; width:26px; height:26px; }
  .confirm svg path { stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:30; stroke-dashoffset:30; }
  .confirm.done svg path { animation:draw 250ms var(--ease-out) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  /* Pulse halqa (variant B/C) */
  .ring { position:absolute; inset:-2px; border-radius:var(--radius-lg); pointer-events:none;
    border:2px solid var(--color-success); opacity:0; }
  .ring.go { animation:ringpulse 300ms var(--ease-out); }
  @keyframes ringpulse { 0%{opacity:.9; transform:scale(0.98);} 100%{opacity:0; transform:scale(1.06);} }

  /* Uchuvchi summa (variant B/C) */
  .fly { position:fixed; z-index:99; font-weight:700; color:var(--color-success-text);
    pointer-events:none; transition:transform var(--motion-slow) var(--ease-out), opacity var(--motion-slow); }

  /* Oxirgi to'lovlar */
  .recent { margin-top:20px; }
  .recent h4 { font-size:12px; color:var(--color-text-muted); text-transform:uppercase;
    letter-spacing:0.4px; margin:0 0 8px; }
  .recent ul { list-style:none; margin:0; padding:0; }
  .recent li { display:flex; justify-content:space-between; padding:10px 12px;
    border-radius:var(--radius-sm); font-size:13px; }
  .recent li + li { margin-top:2px; }
  .recent li.new { animation:landin 800ms var(--ease-out); }
  @keyframes landin { 0%{background:oklch(0.63 0.16 150 / 0.18); transform:translateY(-4px);}
    100%{background:transparent; transform:none;} }
  .recent .t { color:var(--color-text-muted); }

  /* Konfetti (variant C) */
  .confetti { position:fixed; width:8px; height:8px; z-index:98; pointer-events:none;
    border-radius:2px; animation:confall 600ms var(--ease-out) forwards; }
  @keyframes confall { 0%{transform:translate(0,0) rotate(0); opacity:1;}
    100%{transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0;} }

  .note { max-width:420px; margin:0 auto 24px; padding:12px 16px; font-size:12px;
    color:var(--color-text-muted); background:var(--color-surface-muted);
    border-radius:var(--radius-md); }
  .note b { color:var(--color-text); }

  /* Sketch toolbar */
  #sketch-tools { position:fixed; bottom:12px; right:12px; z-index:9999; font:12px system-ui;
    background:rgba(0,0,0,0.72); color:#fff; padding:8px 12px; border-radius:8px;
    opacity:0.4; transition:opacity 0.2s; display:flex; gap:8px; align-items:center; }
  #sketch-tools:hover { opacity:1; }
  #sketch-tools select { font-size:12px; }
</style>
</head>
<body>

<div id="variant-nav">
  <strong style="font-size:12px;margin-right:4px;">001 · Kassir vau</strong>
  <button class="variant-tab active" onclick="showVariant('a', this)">A: Minimal</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B: Apple Pay to'liq ★</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C: B + plan-konfetti</button>
</div>

<div id="variant-a" class="variant active"></div>
<div id="variant-b" class="variant"></div>
<div id="variant-c" class="variant"></div>

<div id="sketch-tools">
  <select onchange="document.getElementById('theme-link').href='../themes/'+this.value+'.css'">
    <option value="default">Neytral (joriy)</option>
    <option value="warm">Iliq (rang 2.0)</option>
  </select>
  <button onclick="setW(420)">📱</button><button onclick="setW(9999)">🖥</button>
</div>

<script>
const NOTES = {
  a: "<b>A — Minimal:</b> bosish 0.97 scale → tugmada check chiziladi (250ms) → qator ro'yxatga tushadi. Jami ~400ms, hech narsa uchmaydi. Eng arzon, eng xavfsiz.",
  b: "<b>B — Apple Pay to'liq (tavsiya ★):</b> check-draw → karta yashil halqa pulsi → summa ro'yxatga <b>uchib qo'nadi</b> → qator yashildan so'nadi → «Bugun yig'ildi» sanab o'sadi → qidiruv avtofokus. ~700ms, lekin BLOKLAMAYDI — input darhol tayyor (≤150ms qoidasi buzilmaydi).",
  c: "<b>C — B + konfetti:</b> hudди B, faqat KUNLIK PLAN bajarilganda (shu maketda har 3-to'lovda simulyatsiya) 12 zarra konfetti, 600ms, bir marta. Har to'lovda EMAS."
};
const NAMES = ["Alisher Karimov","Gulnora Rahimova","Botir Ergashev","Dildora Yusupova","Sherzod Toshev"];
let payCount = 0;

function screen(v) {
  return `
  <div class="note">${NOTES[v]}</div>
  <div class="phone">
    <div class="phone-head">
      <span class="who">Kassir · Karmana bozori</span>
      <span class="today"><span class="lbl">Bugun yig'ildi</span><br>
        <span class="val money" id="today-${v}">248 000 so'm</span></span>
    </div>
    <div class="phone-body">
      <div class="search"><span>🔍</span>
        <input id="search-${v}" placeholder="Rasta raqami yoki ism…" value="A-12"></div>
      <div class="stall-card" id="card-${v}">
        <div class="ring" id="ring-${v}"></div>
        <div class="stall-num">Rasta A-12 · Sabzavot</div>
        <div class="stall-name">Alisher Karimov</div>
        <div class="sum-lbl">Kutilayotgan patta</div>
        <div class="sum money" id="sum-${v}">8 000 <small>so'm</small></div>
        <div class="paytype">
          <button class="sel" onclick="selPay(this)">Naqd</button>
          <button onclick="selPay(this)">Terminal</button>
        </div>
        <button class="confirm" id="btn-${v}" onclick="pay('${v}')">
          <span class="btxt">To'lovni tasdiqlash</span>
          <svg viewBox="0 0 24 24"><path d="M4 12.5 L10 18 L20 6"/></svg>
        </button>
      </div>
      <div class="recent">
        <h4>Oxirgi to'lovlar</h4>
        <ul id="list-${v}">
          <li><span>B-07 · G'ulom Nazarov</span><span class="money">5 000</span><span class="t">2 daqiqa oldin</span></li>
          <li><span>A-03 · Zaynab Qodirova</span><span class="money">8 000</span><span class="t">6 daqiqa oldin</span></li>
        </ul>
      </div>
    </div>
  </div>`;
}
['a','b','c'].forEach(v => document.getElementById('variant-'+v).innerHTML = screen(v));

function selPay(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
function showVariant(id, tab){
  document.querySelectorAll('.variant').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.variant-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('variant-'+id).classList.add('active'); tab.classList.add('active');
}
function setW(w){ document.querySelectorAll('.phone').forEach(p=>p.style.maxWidth=Math.min(w,420)+'px'); }
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function pay(v){
  const btn = document.getElementById('btn-'+v);
  if (btn.classList.contains('done')) return;
  payCount++;
  btn.classList.add('done');                                  // 1-2: press + check-draw

  if (v !== 'a' && !reduced) {
    const ring = document.getElementById('ring-'+v);          // 3: pulse halqa
    setTimeout(()=>{ ring.classList.add('go');
      setTimeout(()=>ring.classList.remove('go'), 350); }, 200);
    flySum(v);                                                // 4: summa uchadi
  }
  if (v === 'c' && payCount % 3 === 0 && !reduced) confetti(v); // C: faqat "plan bajarildi"

  const delay = (v==='a'||reduced) ? 300 : 550;
  setTimeout(()=>{ addRow(v); countUp(v); }, delay);          // 5: qator + hisoblagich
  setTimeout(()=>{                                            // 6: keyingi mijozga tayyor
    btn.classList.remove('done');
    const s = document.getElementById('search-'+v);
    s.value=''; s.focus();
  }, (v==='a'||reduced) ? 500 : 900);
}
function flySum(v){
  const sum = document.getElementById('sum-'+v), list = document.getElementById('list-'+v);
  const r1 = sum.getBoundingClientRect(), r2 = list.getBoundingClientRect();
  const f = document.createElement('div');
  f.className='fly money'; f.textContent='8 000';
  f.style.left=r1.left+r1.width/2-24+'px'; f.style.top=r1.top+'px';
  document.body.appendChild(f);
  requestAnimationFrame(()=>{ f.style.transform=
    `translate(${r2.left-r1.left+20}px, ${r2.top-r1.top+8}px) scale(0.6)`; f.style.opacity='0.2'; });
  setTimeout(()=>f.remove(), 450);
}
function addRow(v){
  const li = document.createElement('li');
  li.className='new';
  li.innerHTML=`<span>A-12 · ${NAMES[payCount%NAMES.length]}</span><span class="money">8 000</span><span class="t">hozirgina</span>`;
  document.getElementById('list-'+v).prepend(li);
}
function countUp(v){
  const el = document.getElementById('today-'+v);
  const from = parseInt(el.textContent.replace(/\D/g,'')), to = from + 8000;
  if (reduced) { el.textContent = to.toLocaleString('ru-RU').replace(/,/g,' ') + " so'm"; return; }
  const t0 = performance.now();
  (function tick(t){ const p = Math.min((t-t0)/400, 1), e = 1-Math.pow(1-p,3);
    el.textContent = Math.round(from+(to-from)*e).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm";
    if (p<1) requestAnimationFrame(tick); })(t0);
}
function confetti(v){
  const card = document.getElementById('card-'+v).getBoundingClientRect();
  const colors = ['oklch(0.63 0.16 150)','oklch(0.56 0.19 255)','oklch(0.78 0.15 85)'];
  for (let i=0;i<12;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = card.left+card.width/2+'px'; c.style.top = card.top+40+'px';
    c.style.background = colors[i%3];
    c.style.setProperty('--dx', (Math.random()*160-80)+'px');
    c.style.setProperty('--dy', (Math.random()*-90-30)+'px');
    c.style.setProperty('--rot', (Math.random()*360)+'deg');
    document.body.appendChild(c); setTimeout(()=>c.remove(), 650);
  }
}
</script>
</body>
</html>
