# Vaqtinchalik — FAQAT birinchi sertifikatni olish uchun (first-cert.sh).
# ⛔ Bu yerda ilova marshrutlari YO'Q: bu server hech qanday backend'ga
#    proxy qilmaydi va sertifikat olingach darhol o'chiriladi.
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
