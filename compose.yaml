# SBOZOR — yagona orkestratsiya nuqtasi.
# Xost mashinasida `make` YO'Q (Windows) — barcha yorliqlar root `package.json` da.
#
# Profillar:
#   (yo'q)   -> db, cache, core-api    : `npm run up`
#   migrate  -> Alembic one-shot job   : `npm run migrate`
#   web      -> frontend (01-02 rejasi Dockerfile'ni yaratadi)
#   proxy    -> nginx
#   test     -> pytest + testcontainers: `npm run test`
#   sim      -> nvr-sim + go2rtc-sim (CAM-09)  : `npm run test:sim`

name: sbozor

services:
  db:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbozor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SBOZOR_OWNER_PASSWORD: ${SBOZOR_OWNER_PASSWORD}
      SBOZOR_APP_PASSWORD: ${SBOZOR_APP_PASSWORD}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      # DIQQAT: postgres 18+ image'i ma'lumotni major-versiya bo'yicha
      # kataloglarda saqlaydi (/var/lib/postgresql/18/docker), shuning uchun
      # volume `/var/lib/postgresql` ga o'rnatiladi — `/var/lib/postgresql/data` ga EMAS
      # (aks holda konteyner "unused mount/volume" xatosi bilan yiqiladi).
      - pgdata:/var/lib/postgresql
      # Rollar + parollar: faqat birinchi ishga tushishda (bo'sh data katalogida) bajariladi.
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DIQQAT: xost portiga publish QILINMAYDI (T-01-04).
    # Dev uchun `compose.override.yml` uni 127.0.0.1 ga bog'laydi.
    restart: unless-stopped

  cache:
    image: valkey/valkey:9.1.1-alpine
    # Kesh — davomiylik kerak emas (volume yo'q), RDB/AOF o'chirilgan.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # One-shot job. Alembic ILOVA STARTUP'ida ishga tushmaydi.
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      # DDL egasi roli — ilova roli EMAS.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      TZ: ${TZ:-Asia/Tashkent}
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    # --workers 1: kelajakdagi scheduler/cron dublikatining oldini oladi.
    #
    # --proxy-headers + --forwarded-allow-ips (CR-04) — bu ikkisi MAJBURIY.
    # uvicorn `X-Forwarded-For` ni FAQAT `--forwarded-allow-ips` ro'yxatidagi
    # manzildan qabul qiladi; standart qiymat `127.0.0.1`. nginx esa compose
    # tarmog'ida BOSHQA konteyner manzilida turadi — ya'ni bayroqsiz uning
    # sarlavhasi TASHLAB YUBORILADI va `request.client.host` har doim proxy
    # IP'si bo'lardi (`auth.py::_client_ip` ishonch qarorini ataylab shu
    # qatlamga topshiradi). Oqibati ikkita:
    #   1) `rl:login:ip:<proxy-ip>` — BUTUN PLATFORMA uchun bitta sanagich.
    #      Chegara (IP_LIMIT=50) parol tekshiruvidan OLDIN ishlaydi, ya'ni
    #      muvaffaqiyatli login uni tozalay olmaydi: ~51 anonim so'rov barcha
    #      kassir/admin/direktorni 15 daqiqaga qulflaydi.
    #   2) `audit_log.ip` har doim proxy manzilini yozadi — "kimdan" savoli
    #      javobsiz qoladi (FOUND-03 dalil sifati).
    #
    # `*` NEGA TAQIQLANGAN (01-13 regressiyasi, hotfix bilan yopildi):
    # uvicorn 0.51.0 `_TrustedHosts.always_trust` holatida
    # `get_trusted_client_address()` zanjirning BIRINCHI (chap) elementini
    # qaytaradi. nginx `$proxy_add_x_forwarded_for` bilan mijoz yuborgan
    # qiymat aynan CHAPDA turardi -> `request.client.host` ni mijozning o'zi
    # tanlardi: rate-limit chetlab o'tilardi, istalgan qurbonni qulflash
    # mumkin edi va `audit_log.ip` soxta qiymat yozardi. nginx endi
    # `$remote_addr` bilan USTIGA yozadi (ops/nginx/nginx.conf), bu yerda esa
    # wildcard O'RNIGA tarmoq oralig'i turadi — ikki qatlam mustaqil.
    #
    # ANIQ RO'YXAT bilan uvicorn zanjirni O'NGDAN CHAPGA yuradi va birinchi
    # ISHONCHSIZ hop'da to'xtaydi — to'g'ri algoritm aynan shu.
    #
    # QIYMAT QANDAY TANLANDI (empirik, 2026-07-29):
    #   docker network inspect sbozor_default --format '{{json .IPAM.Config}}'
    #   -> [{"Subnet":"172.19.0.0/16","Gateway":"172.19.0.1"}]
    # Kuzatilgan /16 QADALMAYDI: Docker bridge tarmoqlariga subnetni standart
    # puldan (172.16.0.0/12 -> /16 bo'laklar) DINAMIK beradi, ya'ni tarmoq
    # qayta yaratilsa `sbozor_default` 172.20.x, 172.21.x ... bo'lib qolishi
    # mumkin va qadalgan /16 jimgina ishlamay qo'yardi. Shuning uchun standart
    # — butun pul: 172.16.0.0/12 (172.16.0.0 – 172.31.255.255).
    #
    # Prod'da toraytiring: tarmoqqa aniq subnet bering va `FORWARDED_ALLOW_IPS`
    # ga aynan o'sha /16 ni (yoki nginx konteyneri manzilini) yozing.
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "1"
      - "--proxy-headers"
      - "--forwarded-allow-ips"
      - "${FORWARDED_ALLOW_IPS:-172.16.0.0/12}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:-redis://cache:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-sbozor}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sbozor-api}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Tashkent
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    # `frontend/Dockerfile` 01-02 rejasida yaratiladi — shu sababli profil ortida,
    # aks holda `npm run up` build xatosi berardi.
    profiles: ["web"]
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      TZ: ${TZ:-Asia/Tashkent}
    depends_on:
      - core-api
    restart: unless-stopped

  nginx:
    profiles: ["proxy"]
    image: nginx:1.30.4-alpine
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_HOST_PORT:-8080}:80"
    restart: unless-stopped

  nvr-sim:
    # SIMULYATSIYA QILINGAN HIKVISION NVR (CAM-09).
    #
    # `profiles: ["sim"]` — bu YAGONA va STRUKTURAVIY himoya (T-03-07):
    # prod deploy profilsiz ishlaydi, ya'ni profilsiz `docker compose up`
    # bu konteynerni umuman KO'RMAYDI. Intizomga (".env da o'chirib qo'yamiz")
    # tayanadigan yechim ertami-kechmi buziladi, profil esa buzilmaydi.
    #
    # `core-api` Dockerfile'ining `dev` target'i QAYTA ISHLATILADI (B.9):
    # yangi Dockerfile yo'q, CI'da yangi build qatlami yo'q, yangi paket yo'q.
    # Bu TO'RTINCHI KONTEYNER, uchinchi servis emas — `migrate` va `tests`
    # bilan aynan bir xil naqsh, ya'ni CLAUDE.md ning "aynan 3 ta servis"
    # cheklovi buzilmaydi.
    profiles: ["sim"]
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    # ⚠ `--no-date-header` MAJBURIY. uvicorn o'z `Date` sarlavhasini ASGI
    # javobidan OLDIN qo'yadi; sim esa siljitilgan `Date` ni qo'yadi (A.3
    # soat-farqi yo'lining yagona sinov vositasi). Bayroqsiz javobda IKKITA
    # `Date` bo'lardi, `httpx` ularni vergul bilan qo'shib berardi va
    # `parsedate_to_datetime` yiqilardi — ya'ni drift o'lchovi jimgina
    # ishlamay qolardi.
    #
    # `--workers` BERILMAYDI: holat jarayon xotirasida yashaydi va ikkinchi
    # ishchi bo'lsa `POST /__sim__/state` ularning faqat bittasiga tegardi.
    command:
      - "uvicorn"
      - "sim.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--no-date-header"
    working_dir: /app/services/nvr-sim
    environment:
      # D-09: CI'da 6 kanal (tez, `DS-7616NI-K2` fixture'iga mos). 25 kanal —
      # alohida sekin test va u konteynerni qayta ko'tarmasdan, ish paytida
      # `POST /__sim__/state {"channel_count": 25}` bilan o'rnatiladi.
      SIM_CHANNEL_COUNT: "${SIM_CHANNEL_COUNT:-6}"
      SIM_RTSP_HOST: go2rtc-sim
      SIM_RTSP_PORT: "8554"
      # `adminAccesses` javobida E'LON QILINADIGAN port (A.2). U go2rtc'ning
      # haqiqiy portidan ATAYIN ajratilgan: `port_moved` stsenariysi aynan
      # "e'lon qilingan port 554 emas" holatini sinaydi.
      SIM_RTSP_PORT_ADVERTISED: "${SIM_RTSP_PORT_ADVERTISED:-554}"
      SIM_USERNAME: "${SIM_USERNAME:-admin}"
      SIM_PASSWORD: "${SIM_PASSWORD:-Sim12345}"
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - .:/app
    healthcheck:
      # Nishon ATAYIN `/__sim__/state`: u Digest talab qilmaydi va
      # `mode="slow"` da HECH QACHON kechiktirilmaydi. `/ISAPI/*` ni
      # tekshirsak, `slow` yoki `bad_password` testi konteynerni
      # `unhealthy` qilib butun stack'ni yiqitardi.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8080/__sim__/state')
      interval: 5s
      timeout: 3s
      retries: 10
    # DIQQAT: xost portiga publish QILINMAYDI (T-01-04, T-03-12) — ichki test
    # yuzasi tarmoqqa ochilmaydi; sim faqat compose tarmog'idan ko'rinadi.

  go2rtc-sim:
    # Sim NVR'ning RTSP manbai. PROD go2rtc'dan ATAYIN ajratilgan: sim NVR
    # "tashqi qurilma" bo'lib qolishi kerak, aks holda prod konfiguratsiyasi
    # test oqimlari bilan aralashardi.
    #
    # ⚠ D-11: `exec:` FAQAT `:ro` mount qilingan statik configdan keladi.
    # go2rtc'ning HTTP API'si orqali `exec:` yozish — RCE
    # (GHSA-wwww-5h25-jf98, CVSS 9.1); shuning uchun API config'da
    # `127.0.0.1` ga bog'langan va bu yerda hech qanday port publish qilinmaydi.
    profiles: ["sim"]
    image: alexxit/go2rtc:1.9.14
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ./ops/go2rtc/go2rtc.sim.yaml:/config/go2rtc.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8554"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    command: ["pytest", "-q"]
    environment:
      # testcontainers konteyner ichidan Docker'ni boshqaradi (docker-outside-of-docker):
      # ishga tushirilgan Postgres xost portiga publish qilinadi, biz unga
      # host.docker.internal orqali boramiz.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Sim testlari (`-m sim`) unga HAQIQIY TCP orqali boradi — `ASGITransport`
      # EMAS. Sabab: `ASGITransport` tarmoqni chetlab o'tadi, ya'ni "kod NVR
      # bilan gaplasha oladi" da'vosi umuman sinalmasdan qolardi. Konteyner
      # ko'tarilmagan bo'lsa `sim_url` fixture'i CI'da `fail` beradi (skip emas).
      NVR_SIM_BASE_URL: "http://nvr-sim:8080"
      SIM_USERNAME: "${SIM_USERNAME:-admin}"
      SIM_PASSWORD: "${SIM_PASSWORD:-Sim12345}"
      CI: "${CI:-}"
      TZ: Asia/Tashkent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
